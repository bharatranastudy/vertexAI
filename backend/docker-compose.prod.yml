services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AUTH_SERVICE=http://auth:8001
      - PROJECT_SERVICE=http://project:8002
      - FILE_SERVICE=http://file:8003
      - AI_SERVICE=http://ai:8004
      - TERMINAL_SERVICE=http://terminal:8005
      - PAYMENT_SERVICE=http://payment:8006
    depends_on:
      - auth
      - project
      - file
      - ai
      - terminal
      - payment

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      - PORT=8001
      - MONGODB_URI=${MONGODB_URI_AUTH}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis

  project:
    build:
      context: .
      dockerfile: services/project/Dockerfile
    environment:
      - PORT=8002
      - MONGODB_URI=${MONGODB_URI_PROJECT}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  file:
    build:
      context: .
      dockerfile: services/file/Dockerfile
    environment:
      - PORT=8003
      - MONGODB_URI=${MONGODB_URI_FILE}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      - PORT=8004
      - MONGODB_URI=${MONGODB_URI_AI}
      - REDIS_URL=redis://redis:6379
      - FILE_SERVICE_URL=http://file:8003
      - AUTH_SERVICE=http://auth:8001
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - redis
      - auth
      - file

  terminal:
    build:
      context: .
      dockerfile: services/terminal/Dockerfile
    environment:
      - PORT=8005
      - MONGODB_URI=${MONGODB_URI_TERMINAL}
      - REDIS_URL=redis://redis:6379
      - FILE_SERVICE_URL=http://file:8003
    depends_on:
      - redis
      - file

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      - PORT=8006
      - MONGODB_URI=${MONGODB_URI_PAYMENT}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:8001
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      - redis
      - auth
